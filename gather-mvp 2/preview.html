<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gather — Etrigan 3.0</title>
<style>
:root{--red:#d71920;--ink:#111;--muted:#747474;--paper:#f5f5f3;--line:#e9e9e6;--card:18px;--shadow:0 8px 28px rgba(17,17,17,.06);--float:0 18px 48px rgba(17,17,17,.12)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}.top{height:82px;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(0,0,0,.05);position:sticky;top:0;z-index:20}.topin{height:100%;max-width:1440px;margin:auto;padding:0 40px;display:flex;align-items:center;gap:32px}.brand{width:230px;flex:none;font-size:28px;font-weight:850;letter-spacing:-.05em}.brand b{color:var(--red)}.tag{font-size:11px;font-weight:650;letter-spacing:.05em;margin:-3px 0 0 66px}.search{height:48px;max-width:600px;flex:1;margin:auto;border-radius:999px;background:#f0f0ef;color:#888;padding:0 20px;display:flex;align-items:center;font-size:14px}.search span{flex:1}.user{min-width:205px;display:flex;align-items:center;gap:12px}.avatar{width:44px;height:44px;border-radius:50%;background:#d8d8d6;display:grid;place-items:center;color:#fff;font-size:19px}.user strong{font-size:14px}.user small{display:block;color:#666;font-size:12px;margin-top:3px}.layout{max-width:1440px;margin:auto;padding:36px 40px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px}.side,.calendar,.empty,.event{background:#fff;border-radius:var(--card);box-shadow:var(--shadow)}.side{padding:24px;height:max-content;position:sticky;top:106px}.nav{display:grid;gap:4px;color:#737373;font-size:14px;font-weight:650}.nav a,.nav div{padding:10px 12px;border-radius:12px}.nav a{text-decoration:none;color:inherit}.nav a:hover,.nav div:hover{background:#f7f7f5}.nav .active{background:#fff1f1;color:var(--red);display:flex;justify-content:space-between}.dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:4px}.sep{height:1px;background:#eee;margin:14px 0}.hero{padding:0 4px 26px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--red)}h1{font-size:50px;line-height:1;margin:9px 0 0;letter-spacing:-.045em}h2{font-size:22px;letter-spacing:-.025em;margin:4px 0 0}.sub{font-size:18px;font-weight:520;color:#3f3f3f;margin-top:10px}.quiet{font-size:14px;color:#888;margin-top:5px}.calendar{padding:24px}.calhead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}.calhead .hint{font-size:12px;color:#858585}.grid{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:6px;min-width:720px}.scroll{overflow:auto;padding-bottom:2px}.day{position:relative;min-height:90px;border:0;border-radius:16px;background:#f7f7f5;text-align:left;padding:12px;transition:.18s}.day:hover{transform:translateY(-2px);background:#efefed}.day.selected{background:var(--red);color:#fff;box-shadow:0 8px 18px rgba(215,25,32,.2)}.weekday{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a}.selected .weekday{color:rgba(255,255,255,.8)}.num{font-size:26px;font-weight:850;letter-spacing:-.03em;margin-top:4px}.today{position:absolute;right:8px;top:8px;border-radius:999px;background:#111;color:#fff;font-size:9px;font-weight:800;padding:3px 7px;text-transform:uppercase}.selected .today{background:rgba(255,255,255,.16)}.eventdot{position:absolute;left:12px;bottom:12px;width:6px;height:6px;border-radius:50%;background:var(--red)}.selected .eventdot{background:#fff}.events{margin-top:28px}.eventhead{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}.count{font-size:13px;color:#888}.event{padding:20px;margin-bottom:10px;border:0;width:100%;text-align:left;transition:.18s}.event:hover{transform:translateY(-2px);box-shadow:var(--float)}.eventrow{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:20px}.time{font-size:14px;font-weight:850}.until{font-size:12px;color:#888;margin-top:4px}.eventmain{border-left:1px solid #eee;padding-left:20px}.cca{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--red)}.eventname{font-size:19px;font-weight:850;margin-top:4px}.loc{font-size:13px;color:#6f6f6f;margin-top:8px}.cta{font-size:13px;font-weight:800;color:var(--red);white-space:nowrap}.empty{padding:68px 24px;text-align:center}.empty .title{font-size:11px;font-weight:850;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}.empty h3{font-size:26px;margin:10px 0 0}.empty p{font-size:14px;color:#777}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:50}.panel{position:absolute;right:0;top:0;height:100%;width:min(480px,100%);background:#fff;padding:30px;box-shadow:var(--float);animation:in .2s ease-out}.close{border:0;background:#f5f5f3;border-radius:50%;width:38px;height:38px;float:right}.pill{display:inline-block;border-radius:999px;background:#fff1f1;color:var(--red);font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;padding:6px 10px}.detail-cca{margin-top:50px;color:var(--red);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.detail h2{font-size:34px;margin-top:8px}.meta{margin-top:28px;border-top:1px solid #eee;border-bottom:1px solid #eee;padding:20px 0;display:grid;gap:15px;font-size:14px}.register{position:absolute;bottom:30px;left:30px;right:30px;background:var(--red);color:#fff;text-align:center;text-decoration:none;padding:14px;border-radius:999px;font-size:13px;font-weight:800}.admin{max-width:980px;margin:auto;padding:40px}.drop{min-height:220px;border:1px dashed rgba(0,0,0,.18);border-radius:18px;background:#fafaf8;display:grid;place-items:center;text-align:center;padding:30px}.drop input{display:none}.adminbox{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:28px}.back{display:inline-block;color:var(--red);font-size:13px;font-weight:800;text-decoration:none;margin-bottom:24px}@keyframes in{from{transform:translateX(100%)}to{transform:translateX(0)}}@media(max-width:900px){.topin{padding:0 20px}.search{display:none}.user{min-width:auto}.layout{grid-template-columns:1fr;padding:24px 20px}.side{position:static}.eventrow{grid-template-columns:1fr}.eventmain{border-left:0;border-top:1px solid #eee;padding:14px 0 0}.cta{justify-self:start}.brand{width:auto}.topin{gap:14px}.tag{margin-left:48px}.admin{padding:24px 20px}}@media(max-width:520px){h1{font-size:42px}.sub{font-size:16px}.layout{padding:20px 14px}.calendar{padding:16px}.side{padding:16px}}
</style></head>
<body><div id="app"></div>
<script>
const names=['Welcome Back Social','Consulting Case Workshop','Finance & Markets Talk','Basketball Trials','Alumni Career Session','Quiz Night','Entrepreneurship Workshop','Cultural Practice','Guest Lecture: The Future of AI','Inter-CCA Football','Product Strategy Workshop','Founders & Finance'];
const ccas=['Cultural Committee','Consulting Club','Finance & Investment Club','Sports Committee','Alumni Office','Quizzing Club','Entrepreneurship Cell','Cultural Committee','Technology Club','Sports Committee','Consulting Club','Finance & Investment Club'];
const times=['17:00','10:00','14:30','18:00','16:00','19:00','11:00','15:00','17:30','13:00','18:30','10:30'];
const locs=['Students Activity Centre','L-17','L-21','SAC Ground','L-18','Mess Lawn','L-14','Auditorium','L-21','Football Ground','L-17','L-21'];
const links=[null,'https://example.com/register',null,null,'https://example.com/alumni',null,'https://example.com/entrepreneurship',null,'https://example.com/ai-talk',null,null,'https://example.com/founders'];
function key(d){return d.toISOString().slice(0,10)} function fmtTime(t){let [h,m]=t.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`} function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
const base=new Date();base.setHours(12,0,0,0);const events=names.map((name,i)=>({id:i,date:key(add(base,[0,1,2,3,4,5,6,8,9,10,11,13][i])),name,cca:ccas[i],time:times[i],loc:locs[i],link:links[i],desc:i===8?'A practical conversation on how AI is changing consulting, business models and campus careers.':null}));
let selected=key(base), drawer=null;
function header(){return `<header class="top"><div class="topin"><div class="brand">Etrigan <b>3.0</b><div class="tag">campus directory</div></div><div class="search"><span>Search campus directory</span><span>⌕</span></div><div class="user"><div class="avatar">●</div><div><strong>Nirav Meghani</strong><small>PGP42147</small></div></div></div></header>`}
function sidebar(){return `<aside class="side"><nav class="nav"><a href="#">⌂ &nbsp; HOME</a><a href="#">◯ &nbsp; MY PROFILE</a><div class="sep"></div><div class="active"><span>◷ &nbsp; GATHER</span><span class="dot"></span></div><a href="#">EVENTS</a><div class="sep"></div><div>CLUBS <span style="float:right">⌄</span></div><div>COMMITTEES <span style="float:right">⌄</span></div><div>SPORTS <span style="float:right">⌄</span></div></nav></aside>`}
function calendar(){let days=Array.from({length:14},(_,i)=>add(base,i));let evdates=new Set(events.map(e=>e.date));let label=`${days[0].toLocaleDateString('en-US',{month:'short'}).toUpperCase()} ${days[0].getDate()} — ${days[13].toLocaleDateString('en-US',{month:'short'}).toUpperCase()} ${days[13].getDate()}`;return `<section class="calendar"><div class="calhead"><div><div class="eyebrow">Two week view</div><h2>${label}</h2></div><div class="hint">Click a day to explore</div></div><div class="scroll"><div class="grid">${days.map(d=>{let k=key(d),sel=k===selected,today=k===key(base);return `<button class="day ${sel?'selected':''}" onclick="selectDay('${k}')"><div class="weekday">${d.toLocaleDateString('en-US',{weekday:'short'})}</div><div class="num">${d.getDate()}</div>${today?'<span class="today">Today</span>':''}${evdates.has(k)?'<span class="eventdot"></span>':''}</button>`}).join('')}</div></div></section>`}
function eventList(){let list=events.filter(e=>e.date===selected), today=selected===key(base), date=new Date(selected+'T12:00:00');let label=date.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});return `<section class="events"><div class="eventhead"><div><div class="eyebrow">${today?'Today':'Selected day'}</div><h2>${label}</h2></div><div class="count">${list.length} ${list.length===1?'event':'events'}</div></div>${list.length?list.map(e=>`<button class="event" onclick="openDrawer(${e.id})"><div class="eventrow"><div><div class="time">${fmtTime(e.time)}</div></div><div class="eventmain"><div class="cca">${e.cca}</div><div class="eventname">${e.name}</div><div class="loc">⌖ &nbsp;${e.loc}</div></div><div class="cta">${e.link?'REGISTER':'VIEW DETAILS'} ↗</div></div></button>`).join(''):`<div class="empty"><div class="title">${today?'Nothing planned today.':'A quiet one.'}</div><h3>${today?'You are officially free.':'Looks like campus is taking a break.'}</h3><p>${today?'Enjoy it while it lasts.':'Check another day in the calendar above.'}</p></div>`}</section>`}
function main(){document.getElementById('app').innerHTML=header()+`<main class="layout">${sidebar()}<div><div class="hero"><div class="eyebrow">Campus calendar</div><h1>GATHER</h1><div class="sub">Everything happening on campus.</div><div class="quiet">That WhatsApp message is probably gone by now.</div></div>${calendar()}${eventList()}</div></main>${drawerHTML()}`}
function drawerHTML(){if(drawer===null)return '';let e=events[drawer],d=new Date(e.date+'T12:00:00');return `<div class="drawer" onclick="if(event.target===this)closeDrawer()"><aside class="panel"><button class="close" onclick="closeDrawer()">×</button><span class="pill">Event details</span><div class="detail-cca">${e.cca}</div><div class="detail"><h2>${e.name}</h2><div class="meta"><div>◷ &nbsp; ${d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div><div>◴ &nbsp; ${fmtTime(e.time)}</div><div>⌖ &nbsp; ${e.loc}</div></div>${e.desc?`<p style="color:#666;line-height:1.7;font-size:14px;margin-top:26px">${e.desc}</p>`:''}</div>${e.link?`<a class="register" href="${e.link}" target="_blank">REGISTER NOW ↗</a>`:`<div class="register" style="background:#f7f7f5;color:#666">NO REGISTRATION REQUIRED</div>`}</aside></div>`}
function selectDay(k){selected=k;main()} function openDrawer(i){drawer=i;main()} function closeDrawer(){drawer=null;main()} main();
</script></body></html>
